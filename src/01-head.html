<title>DuoMind</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* Layout: centered hub — particle brain on a light pedestal, glass cards wired to it; app pages share one top bar. */
:root{
  --bg:#030917; --bg2:#06112b; --ink:#eaf2ff; --muted:#8ea5cc; --dim:#5f769e;
  --accent:#3d8bff; --accent2:#7cc6ff; --glow:rgba(61,139,255,.55);
  --card:rgba(12,28,70,.42); --card2:rgba(18,38,92,.5); --line:rgba(96,156,255,.20); --line2:rgba(124,198,255,.42);
  --good:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --display:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 620px at 50% 38%,rgba(29,78,216,.30),transparent 62%),radial-gradient(700px 500px at 88% 95%,rgba(56,189,248,.10),transparent 60%),radial-gradient(640px 480px at 6% 10%,rgba(37,99,235,.14),transparent 60%),linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:10px}
a{color:var(--accent2)}
[hidden]{display:none!important}
.thread svg{width:16px;height:16px;flex:none;stroke:var(--accent2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#stars,#gl{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#stars{z-index:0}#gl{z-index:20}
.shell{position:relative;z-index:3;min-height:100vh}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .8s var(--ease),visibility .8s}
#loader.done{opacity:0;visibility:hidden}
.ld{display:flex;flex-direction:column;align-items:center;gap:22px}
.ld-ring{position:relative;width:132px;height:132px}
.ld-ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ld-ring circle{fill:none;stroke-width:3}
.ld-ring .t{stroke:rgba(96,156,255,.14)}
.ld-ring .p{stroke:url(#ldg);stroke-linecap:round;stroke-dasharray:377;stroke-dashoffset:377;transition:stroke-dashoffset .4s var(--ease);filter:drop-shadow(0 0 8px var(--glow))}
.ld-ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 22px var(--display);font-variant-numeric:tabular-nums}
.ld-dots{position:absolute;inset:0;animation:spin 6s linear infinite}
.ld-dots i{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--accent2);box-shadow:0 0 8px var(--accent2)}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-t{font:600 15px var(--display);letter-spacing:.24em;color:#cfe0ff}
.ld-s{font-size:12.5px;color:var(--muted);min-height:18px;letter-spacing:.02em}

/* ---------- glass + cards ---------- */
.glass{background:linear-gradient(155deg,rgba(22,44,104,.48),rgba(8,20,54,.40));border:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 60px -28px rgba(0,0,0,.8),0 0 50px -24px var(--glow);border-radius:var(--r)}
.card{position:relative;border-radius:var(--r);transform-style:preserve-3d;transition:transform .6s var(--ease)}
.card.hov{transition:transform .12s linear}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(155deg,rgba(22,46,108,.50),rgba(8,20,54,.42));border:1px solid var(--line);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 30px rgba(61,139,255,.05),0 24px 60px -28px rgba(0,0,0,.8),0 0 50px -26px var(--glow);transition:border-color .3s}
.card>*{position:relative;transform:translateZ(16px)}
.card>.z2{transform:translateZ(34px)}
.card>.glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;transform:translateZ(40px);
  background:radial-gradient(360px circle at var(--gx,50%) var(--gy,50%),rgba(170,210,255,.14),transparent 46%)}
.card.hov>.glare{opacity:1}
.card.hov::before{border-color:var(--line2)}
.pad{padding:18px}
.eyebrow{font:600 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent2)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.h2{font:600 26px/1.2 var(--display);letter-spacing:-.02em;text-wrap:balance}
.h3{font:600 17px/1.3 var(--display)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:rgba(40,80,170,.22);color:var(--ink);
  font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;transform:translate(var(--mx,0px),var(--my,0px)) scale(var(--s,1));
  transition:transform .25s var(--ease),background .25s,border-color .25s,box-shadow .3s;white-space:nowrap}
.btn:hover{background:rgba(61,139,255,.24);border-color:rgba(150,200,255,.6)}
.btn:active{--s:.95}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
.btn:hover svg.arr{transform:translateX(4px)}
.btn-primary{background:linear-gradient(135deg,#4a95ff,#2563eb);border-color:rgba(160,205,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 12px 34px -10px rgba(61,139,255,.95)}
.btn-primary:hover{background:linear-gradient(135deg,#5ba0ff,#3170f0);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 14px 44px -8px rgba(80,150,255,1)}
.btn-pill{border-radius:999px;padding:14px 28px;font-size:16px}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:rgba(61,139,255,.12);border-color:var(--line)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn-danger{border-color:rgba(251,113,133,.45);background:rgba(251,113,133,.1)}
.btn-danger:hover{background:rgba(251,113,133,.2);border-color:rgba(251,113,133,.7)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:rip .65s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3.8);opacity:0}}
.burst{animation:burst .6s ease-out}
@keyframes burst{0%{box-shadow:0 0 0 0 rgba(124,198,255,.7)}100%{box-shadow:0 0 0 18px rgba(124,198,255,0)}}
.chip{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(14,32,80,.45);font-size:13px;color:#d6e6ff;transition:transform .25s var(--ease),border-color .25s,background .25s,box-shadow .3s}
.chip:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 8px 20px -10px var(--glow)}
.chip.on{background:linear-gradient(135deg,rgba(74,149,255,.4),rgba(37,99,235,.3));border-color:rgba(150,200,255,.7);color:#fff;box-shadow:0 0 22px -6px var(--glow)}
.chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:6px;flex:none}
.tag.SAID{color:#c7dbff;background:rgba(61,139,255,.18);border:1px solid rgba(61,139,255,.35)}
.tag.DID{color:#86efc6;background:rgba(52,211,153,.13);border:1px solid rgba(52,211,153,.33)}
.tag.INFERRED{color:#fcd98a;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.33)}
.tag.PREDICTED{color:#a5e4ff;background:rgba(124,198,255,.13);border:1px solid rgba(124,198,255,.35)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.12em;padding:4px 9px;border-radius:7px}
.badge.robust{color:#86efc6;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4)}
.badge.fragile{color:#fcd98a;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.45)}
.badge.ai{color:#cfe2ff;background:rgba(61,139,255,.16);border:1px solid rgba(61,139,255,.4)}
.badge.local{color:#fcd98a;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35)}

/* ---------- inputs ---------- */
.field{position:relative;display:block}
.field input,.field textarea,.field select{width:100%;background:rgba(4,12,34,.6);border:1px solid var(--line);border-radius:12px;padding:20px 14px 8px;font-size:15px;outline:0;transition:border-color .25s,box-shadow .25s,background .25s}
.field textarea{resize:vertical;min-height:84px}
.field select{appearance:none;-webkit-appearance:none;padding:20px 36px 8px 14px;background-image:linear-gradient(45deg,transparent 50%,#8ea5cc 50%),linear-gradient(135deg,#8ea5cc 50%,transparent 50%);background-position:calc(100% - 18px) 24px,calc(100% - 13px) 24px;background-size:5px 5px;background-repeat:no-repeat}
select option{background:#0a1838;color:#fff}
.field span{position:absolute;left:15px;top:14px;font-size:15px;color:var(--dim);pointer-events:none;transition:all .2s var(--ease)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(124,198,255,.7);box-shadow:0 0 0 4px rgba(61,139,255,.16);background:rgba(6,16,44,.75)}
.field input:focus+span,.field input:not(:placeholder-shown)+span,.field textarea:focus+span,.field textarea:not(:placeholder-shown)+span,.field select+span{top:6px;font-size:11px;color:var(--accent2);letter-spacing:.02em}
.field .eye{position:absolute;right:8px;top:9px;border:0;background:transparent;color:var(--muted);padding:6px;border-radius:8px}
.field .eye:hover{color:#fff;background:rgba(61,139,255,.14)}
.field .eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.field.err input{border-color:rgba(251,113,133,.7);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ferr{font-size:12px;color:#fda4b4;min-height:16px;margin-top:5px}
.meter{display:flex;gap:4px;margin-top:8px}
.meter i{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.08);transition:background .3s}
.meter.s1 i:nth-child(1){background:var(--bad)}
.meter.s2 i:nth-child(-n+2){background:var(--warn)}
.meter.s3 i:nth-child(-n+3){background:#60a5fa}
.meter.s4 i{background:var(--good)}
.check{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13.5px;color:#cfe0ff;user-select:none}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.check .bx{width:20px;height:20px;border-radius:6px;border:1px solid var(--line2);display:grid;place-items:center;transition:background .25s,border-color .25s}
.check .bx svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .35s .05s var(--ease)}
.check input:checked+.bx{background:var(--accent);border-color:var(--accent)}
.check input:checked+.bx svg{stroke-dashoffset:0}
.check input:focus-visible+.bx{outline:2px solid var(--accent2);outline-offset:2px}
.switch{position:relative;width:46px;height:26px;flex:none;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch span{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--line2);transition:background .3s,box-shadow .3s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#cfe0ff;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.switch input:checked+span{background:linear-gradient(135deg,#4a95ff,#2563eb);box-shadow:0 0 18px -3px var(--glow)}
.switch input:checked+span::after{transform:translateX(20px);background:#fff}
.switch input:focus-visible+span{outline:2px solid var(--accent2);outline-offset:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:4px;outline:0;background:linear-gradient(90deg,var(--accent) var(--p,50%),rgba(255,255,255,.1) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(61,139,255,.35),0 0 14px var(--accent);cursor:pointer;transition:transform .2s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(61,139,255,.35);cursor:pointer}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;display:flex;align-items:center;gap:16px;justify-content:space-between;pointer-events:none;transition:transform .5s var(--ease),opacity .5s}
.topbar>*{pointer-events:auto}
.topbar.hide{transform:translateY(-120%);opacity:0}
.brand{display:flex;align-items:center;gap:10px;font:600 17px var(--display);letter-spacing:-.01em;text-decoration:none;color:var(--ink);border:0;background:transparent}
.brand .mk{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#8fd0ff,#2563eb 70%);box-shadow:0 0 22px rgba(61,139,255,.7)}
.brand .mk svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round}
.nav{position:relative;display:flex;gap:2px;padding:5px;border-radius:999px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;transition:color .3s;overflow:hidden}
.nav a:hover{color:#e2ecff}
.nav a.on{color:#fff}
.nav a svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-ind{position:absolute;left:0;top:5px;bottom:5px;width:80px;border-radius:999px;z-index:0;background:linear-gradient(135deg,rgba(74,149,255,.5),rgba(37,99,235,.38));border:1px solid rgba(150,200,255,.55);box-shadow:0 0 24px -2px var(--glow),inset 0 1px 0 rgba(255,255,255,.2)}
.me{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 14px var(--display);background:linear-gradient(135deg,#1d4ed8,#38bdf8);border:1px solid rgba(160,210,255,.6);box-shadow:0 0 16px -4px var(--glow);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.vchip{font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:999px;color:#cfe2ff}
.menu{position:absolute;right:20px;top:64px;min-width:230px;padding:8px;display:none;z-index:50}
.menu.open{display:block;animation:pop .25s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.menu button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;padding:10px 12px;border:0;background:transparent;border-radius:10px;font-size:14px}
.menu button:hover{background:rgba(61,139,255,.14)}
.menu .who{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}

/* ---------- pages ---------- */
#pages{perspective:1600px}
.page{display:none;padding:calc(96px + env(safe-area-inset-top,0px)) 24px 64px;max-width:1280px;margin:0 auto}
.page.on{display:block}
.page.full{max-width:none;padding:0}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:24px;padding:24px clamp(16px,4vw,64px)}
.auth-l{position:relative;min-height:560px;display:flex;flex-direction:column;justify-content:space-between;padding:12px 0}
.auth-anchor{position:relative;flex:1;min-height:380px}
.auth-copy h1{font:600 clamp(34px,4.4vw,56px)/1.05 var(--display);letter-spacing:-.03em;text-wrap:balance}
.auth-copy h1 em{font-style:normal;color:var(--accent)}
.auth-copy p{color:var(--muted);max-width:460px;margin-top:14px;font-size:15.5px}
.proof{display:flex;gap:22px;flex-wrap:wrap;margin-top:22px}
.proof div{font-size:12.5px;color:var(--muted)}.proof b{display:block;font:600 20px var(--display);color:var(--ink)}
.auth-card{width:100%;max-width:440px;justify-self:center;padding:30px}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:12px;background:rgba(4,12,34,.6);border:1px solid var(--line);margin:18px 0 20px}
.tabs button{position:relative;z-index:1;border:0;background:transparent;padding:9px;font-size:14px;font-weight:600;color:var(--muted);border-radius:9px;transition:color .3s}
.tabs button.on{color:#fff}
.tabs .ti{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:9px;background:linear-gradient(135deg,rgba(74,149,255,.55),rgba(37,99,235,.45));box-shadow:0 0 18px -4px var(--glow);transition:transform .45s var(--ease)}
.tabs.sign-up .ti{transform:translateX(100%)}
.form{display:grid;gap:12px}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:12px;margin:6px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.sso{width:100%;justify-content:center;gap:10px}
.fine{font-size:11.5px;color:var(--dim);text-align:center;margin-top:12px;line-height:1.5}
.formnote{font-size:12.5px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(4,12,34,.5);color:#cfe0ff;display:none}
.formnote.show{display:block}

/* onboarding */
.ob{max-width:760px;margin:0 auto;padding:28px}
.steps{display:flex;gap:6px;margin:14px 0 22px}
.steps i{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.steps i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#4a95ff,#7cc6ff);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.steps i.on::after{transform:scaleX(1)}
.ob-step{display:none}.ob-step.on{display:block}
.sectors{display:flex;flex-wrap:wrap;gap:8px}
.qcard{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(4,12,34,.4);margin-bottom:12px}
.qcard p{font-weight:600;margin-bottom:10px}
.qopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qopt{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);background:rgba(10,24,62,.5);padding:10px 12px;border-radius:11px;font-size:13px;line-height:1.4;transition:border-color .25s,background .25s,transform .25s}
.qopt:hover{border-color:var(--line2);transform:translateY(-2px)}
.qopt.on{border-color:rgba(150,200,255,.8);background:rgba(61,139,255,.24);box-shadow:0 0 20px -6px var(--glow)}
.tagin{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(4,12,34,.6);min-height:52px;align-items:center}
.tagin input{flex:1;min-width:180px;border:0;background:transparent;outline:0;font-size:15px;padding:6px}
.tagin .chip{padding:6px 8px 6px 12px}
.tagin .chip button{border:0;background:rgba(255,255,255,.1);width:20px;height:20px;border-radius:50%;font-size:13px;line-height:1;color:#fff}
.slider-row{display:grid;gap:8px;margin-bottom:18px}
.slider-row label{display:flex;justify-content:space-between;font-size:14px}
.slider-row label b{color:var(--accent2);font-variant-numeric:tabular-nums}
.ob-foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px}

/* home hub */
.hub-head{text-align:center;margin-top:8px}
.hub-head .hello{font-size:13px;color:var(--muted);letter-spacing:.02em}
.hub-head h1{font:600 clamp(34px,4.6vw,58px)/1.08 var(--display);letter-spacing:-.03em;text-wrap:balance;margin-top:10px}
.hub-head h1 .l2{display:block;color:var(--accent)}
.hub-head h1 .w{display:inline-block;will-change:transform}
.stage{position:relative;height:560px;margin-top:10px}
.stage-anchor{position:absolute;left:50%;top:0;width:min(470px,48vw);height:100%;transform:translateX(-50%);cursor:grab}
.stage-anchor:active{cursor:grabbing}
.hubcard{position:absolute;width:250px;padding:18px;cursor:pointer}
.hubcard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);box-shadow:0 8px 24px -8px rgba(61,139,255,.9)}
.hubcard .ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hubcard .ic.round{border-radius:50%}
.hubcard b{display:block;font:600 16px/1.3 var(--display)}
.hubcard .v{font:600 28px var(--display);letter-spacing:-.02em;margin:2px 0 2px;font-variant-numeric:tabular-nums}
.hubcard p{color:var(--muted);font-size:13.5px;margin-top:6px}
.hubcard .dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2);top:50%;margin-top:-3.5px;transform:none}
.hc-tl{left:0;top:30px}.hc-bl{left:0;bottom:30px}.hc-tr{right:0;top:30px}.hc-br{right:0;bottom:30px}
.hc-tl .dot,.hc-bl .dot{right:-4px}.hc-tr .dot,.hc-br .dot{left:-4px}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
#wires path{fill:none;stroke:rgba(124,198,255,.45);stroke-width:1.2;stroke-dasharray:600;stroke-dashoffset:600}
#wires circle{fill:#bfe3ff}
.hub-cta{display:flex;justify-content:center;margin-top:8px}
.hub-row{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px;margin-top:40px}
.sug{display:flex;flex-direction:column;gap:8px}
.sug button{position:relative;overflow:hidden;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(4,12,34,.45);font-size:14px;line-height:1.4;display:flex;gap:10px;align-items:center;transition:border-color .25s,transform .25s,background .25s}
.sug button:hover{border-color:var(--line2);transform:translateX(4px);background:rgba(61,139,255,.1)}
.sug button svg{width:16px;height:16px;flex:none;stroke:var(--accent2);fill:none;stroke-width:2}
.list-i{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(96,156,255,.1);font-size:13.5px}
.list-i:last-child{border-bottom:0}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13.5px;text-align:center}

/* traits */
.trait{padding:10px 0}
.trait .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.trait .top b{font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#2563eb,#7cc6ff);transition:transform 1.2s cubic-bezier(.2,.9,.2,1);border-radius:inherit}
.bar.b i{background:linear-gradient(90deg,#0ea5e9,#a5f3fc)}
.bar.warn i{background:linear-gradient(90deg,#f59e0b,#fb7185)}
.bar.good i{background:linear-gradient(90deg,#10b981,#6ee7b7)}

/* chat */
.chat{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;height:calc(100vh - 116px);min-height:540px}
.threads{display:flex;flex-direction:column;padding:14px;min-height:0}
.threads .list{flex:1;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:4px;min-height:0}
.thread{position:relative;overflow:hidden;text-align:left;border:1px solid transparent;background:transparent;border-radius:11px;padding:10px 12px;font-size:13.5px;color:#d7e5ff;display:flex;gap:8px;align-items:center;transition:background .2s,border-color .2s}
.thread:hover{background:rgba(61,139,255,.1)}
.thread.on{background:rgba(61,139,255,.2);border-color:rgba(124,198,255,.45)}
.thread span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.convo{display:flex;flex-direction:column;min-height:0;padding:0;overflow:hidden}
.convo-h{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line)}
.orb{width:104px;height:70px;flex:none;position:relative}
.convo-h .st{font-size:12.5px;color:var(--muted)}
.msgs{flex:1;overflow:auto;padding:20px 18px;display:flex;flex-direction:column;gap:16px;min-height:0;scroll-behavior:smooth}
.msg{max-width:min(760px,92%);display:flex;gap:10px;animation:msgIn .5s var(--ease)}
@keyframes msgIn{from{opacity:0;transform:translateY(12px)}}
.msg.u{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:12px 15px;border-radius:16px;font-size:14.5px;line-height:1.6;min-width:0;overflow-wrap:anywhere}
.msg.u .bubble{background:linear-gradient(135deg,#2f7bff,#1e4fd6);border-radius:16px 16px 4px 16px;box-shadow:0 10px 26px -12px rgba(61,139,255,.9)}
.msg.a .bubble{background:rgba(12,28,70,.55);border:1px solid var(--line);border-radius:16px 16px 16px 4px}
.msg .av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 12px var(--display);background:radial-gradient(circle at 35% 30%,#8fd0ff,#2563eb 70%);box-shadow:0 0 14px -2px var(--glow)}
.bubble p+p,.bubble ul+p,.bubble p+ul{margin-top:8px}
.bubble ul{padding-left:18px}.bubble li+li{margin-top:3px}
.bubble strong{color:#fff}
.bubble code{font-size:13px;background:rgba(0,0,0,.3);padding:1px 5px;border-radius:5px}
.steps-live{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.steps-live div{display:flex;align-items:center;gap:8px}
.steps-live .sp{width:14px;height:14px;border-radius:50%;border:2px solid rgba(124,198,255,.25);border-top-color:var(--accent2);animation:spin .8s linear infinite}
.steps-live .ok{width:14px;height:14px;border-radius:50%;background:var(--good);display:grid;place-items:center}
.steps-live .ok svg{width:9px;height:9px;stroke:#04221a;stroke-width:3.5;fill:none}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--accent2);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{transform:translateY(-5px);opacity:.4}}
.meta{font-size:11.5px;color:var(--dim);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.composer{padding:12px 14px 14px;border-top:1px solid var(--line)}
.sugs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.sugs::-webkit-scrollbar{display:none}
.sugs .chip{flex:none}
.box{display:flex;gap:10px;align-items:flex-end;padding:8px 8px 8px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(4,12,34,.6);transition:border-color .25s,box-shadow .25s}
.box:focus-within{border-color:rgba(124,198,255,.6);box-shadow:0 0 0 4px rgba(61,139,255,.14)}
.box textarea{flex:1;border:0;background:transparent;outline:0;resize:none;font-size:15px;line-height:1.5;max-height:160px;padding:7px 0}
.send{width:42px;height:42px;border-radius:12px;border:0;display:grid;place-items:center;background:linear-gradient(135deg,#4a95ff,#2563eb);box-shadow:0 8px 20px -8px var(--glow);transition:transform .25s var(--ease),background .3s}
.send:hover{transform:scale(1.06)}.send:active{transform:scale(.94)}
.send svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.send .i-stop{display:none}.send.stop{background:linear-gradient(135deg,#f43f5e,#be123c)}
.send.stop .i-send{display:none}.send.stop .i-stop{display:block;fill:#fff}
.hint{font-size:11.5px;color:var(--dim);margin-top:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* decision card (chat + lab) */
.dcard{margin-top:12px;padding:16px;border-radius:14px;border:1px solid var(--line2);background:linear-gradient(160deg,rgba(18,40,98,.6),rgba(6,16,44,.55))}
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(4,12,34,.45);transition:border-color .3s,box-shadow .3s}
.opt.win{border-color:rgba(124,198,255,.8);box-shadow:0 0 26px -8px var(--glow)}
.opt .ol{font-weight:600;font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.opt .ol em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.1em;padding:3px 7px;border-radius:6px;background:linear-gradient(135deg,#4a95ff,#2563eb);flex:none;align-self:flex-start}
.sc{display:grid;grid-template-columns:92px 1fr 26px;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);margin:4px 0}
.sc .bar{height:5px}
.sc b{color:var(--ink);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.rng{position:relative;height:16px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin-top:8px}
.rng .band{position:absolute;top:3px;bottom:3px;border-radius:5px;background:linear-gradient(90deg,rgba(61,139,255,.35),rgba(124,198,255,.75));animation:grow 1s var(--ease) both}
.rng .mk{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;border-radius:2px;background:#fff;box-shadow:0 0 10px #fff}
@keyframes grow{from{transform:scaleX(0);opacity:0}}
.recbox{display:flex;gap:14px;align-items:center;margin-top:14px;padding:12px;border-radius:12px;background:rgba(4,12,34,.45);border:1px solid var(--line)}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .rb{stroke:rgba(255,255,255,.08)}
.ring .rf{stroke:url(#rg2);stroke-linecap:round;stroke-dasharray:176;stroke-dashoffset:176;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.9,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 15px var(--display)}
.lev{display:flex;gap:10px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(4,12,34,.35);font-size:13px;margin-top:6px}
.lev .k{width:22px;height:22px;flex:none;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;background:rgba(61,139,255,.22)}
.flip{color:#fcd98a;font-weight:600}.narrow{color:#a5e4ff;font-weight:600}
details.ev{margin-top:10px}
details.ev summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent2);list-style:none;display:flex;align-items:center;gap:6px}
details.ev summary::-webkit-details-marker{display:none}
details.ev summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .25s}
details.ev[open] summary::before{transform:rotate(45deg)}
.evi{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(96,156,255,.1);font-size:13px}
.evi:last-child{border-bottom:0}
.evi.x{opacity:.45}.evi.x .t{text-decoration:line-through}
.evi .m{font-size:11px;color:var(--dim);margin-top:2px}
.xb{font-size:10px;padding:2px 6px;border-radius:5px;color:#fda4b4;border:1px solid rgba(251,113,133,.35);background:rgba(251,113,133,.12);margin-left:6px;text-decoration:none;display:inline-block}
.insuff{padding:14px;border-radius:12px;border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.07);font-size:13.5px}
.insuff b{color:#fcd98a}

/* lab */
.lab{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.dl{max-height:calc(100vh - 170px);overflow:auto;display:flex;flex-direction:column;gap:6px}
.chartbox{position:relative;height:320px}
.seg{display:inline-flex;padding:4px;gap:3px;border-radius:12px;background:rgba(4,12,34,.6);border:1px solid var(--line)}
.seg button{position:relative;overflow:hidden;border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:9px;transition:background .25s,color .25s}
.seg button.on{background:linear-gradient(135deg,#4a95ff,#2563eb);color:#fff;box-shadow:0 0 16px -4px var(--glow)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.stat .k{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:600;text-transform:uppercase}
.stat .v{font:600 32px var(--display);letter-spacing:-.02em;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10.5px;letter-spacing:.12em;color:var(--muted);text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--line);text-transform:uppercase}
.tbl td{padding:10px 8px;border-bottom:1px solid rgba(96,156,255,.1);vertical-align:top}
.tblwrap{overflow-x:auto}
.mem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(96,156,255,.1)}
.mem .x{margin-left:auto;border:0;background:transparent;color:var(--dim);padding:4px 6px;border-radius:7px}
.mem .x:hover{color:#fda4b4;background:rgba(251,113,133,.12)}
.perm{display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(4,12,34,.35);margin-bottom:10px}
.perm small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}

/* modal + toast */
.mwrap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,6,20,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mwrap.open{display:flex}
.modal{position:relative;width:min(620px,100%);max-height:86vh;overflow:auto;padding:26px}
.mx{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:rgba(10,24,62,.7);font-size:18px}
.mx:hover{background:rgba(61,139,255,.3)}
#toasts{position:fixed;top:calc(76px + env(safe-area-inset-top,0px));right:18px;z-index:90;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;padding:12px 16px;min-width:240px;max-width:360px;font-size:13.5px;pointer-events:auto;border-radius:14px}
.toast .d{width:9px;height:9px;border-radius:50%;flex:none;background:var(--accent2);box-shadow:0 0 10px var(--accent2)}
.toast.good .d{background:var(--good);box-shadow:0 0 10px var(--good)}
.toast.warn .d{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.spark{width:100%;height:80px}
.spark path{fill:none;stroke:var(--accent2);stroke-width:2.2;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s ease forwards;filter:drop-shadow(0 0 5px rgba(124,198,255,.7))}
.spark circle{fill:#fff}.spark text{fill:#8ea5cc;font-size:10px}
@keyframes draw{to{stroke-dashoffset:0}}

/* v3: brain map, tooltip, drivers, disclaimer, demo */
#brainTip{position:fixed;z-index:60;pointer-events:none;padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.4;min-width:170px;transform:translate(14px,14px)}
#brainTip b{display:block;font-size:13px;margin-bottom:2px}
#brainTip small{color:var(--muted)}
.rdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0;box-shadow:0 0 8px currentColor;background:currentColor}
.trait{border-radius:10px;padding:10px 8px;margin:0 -8px;transition:background .25s}
.trait.hl{background:rgba(124,198,255,.1)}
.ins-brain{position:relative;height:230px;margin:6px 0 4px;cursor:grab}
.lab-orb{width:120px;height:78px}
.drivers{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:12px;color:var(--muted)}
.drv{display:inline-flex;align-items:center;gap:0;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(4,12,34,.45);font-size:12px;color:#dbe8ff;transition:border-color .25s,transform .25s}
.drv:hover{border-color:var(--line2);transform:translateY(-1px)}
.disclaim{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:11.5px;color:var(--dim);line-height:1.45}
.disclaim svg{width:14px;height:14px;flex:none;stroke:var(--dim);fill:none;stroke-width:2;margin-top:1px}
.demo-btn{width:100%;border-style:dashed;border-color:rgba(124,198,255,.45);color:#cfe4ff}
.demo-btn:hover{border-style:solid}
.vchip.demo{color:#fcd98a;border-color:rgba(251,191,36,.45)}
@media (max-width:1100px){
  .hub-row{grid-template-columns:1fr 1fr}
  .hubcard{width:210px}
  .lab{grid-template-columns:1fr}
  .dl{max-height:260px}
}
@media (max-width:900px){
  .auth{grid-template-columns:1fr}
  .auth-l{min-height:auto}.auth-anchor{min-height:280px}
  .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .nav a span{display:none}.nav a{padding:10px 14px}
  .page{padding-bottom:110px}
  .chat{grid-template-columns:1fr;height:auto}
  .threads{display:none}
  .convo{height:calc(100vh - 200px);min-height:480px}
  .stage{height:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:320px}
  .stage-anchor{height:320px;width:100%}
  .hubcard{position:relative;width:auto;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important}
  .hubcard .dot{display:none}
  #wires{display:none}
  .grid2,.grid3,.qopts{grid-template-columns:1fr}
  .hub-row{grid-template-columns:1fr}
  .vchip{display:none}
}
@media (max-width:520px){
  .page{padding-left:16px;padding-right:16px}
  .stage{grid-template-columns:1fr}
  .auth-card{padding:22px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.15s!important;scroll-behavior:auto!important}}
</style>
